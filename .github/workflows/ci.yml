name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test, Audit & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Check
        run: npm run lint

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Circular Dependencies Check
        run: npm run test:circular

      - name: Unit Tests (Vitest)
        run: npm run test:unit

      - name: Sync Dataset Directories & Catalogs
        run: npm run data:sync

      - name: Run Comprehensive Integration Test Suite
        run: node scripts/run-all-tests.mjs

      - name: Security Dependency Audit
        run: npm audit --omit=dev

      - name: Production Build
        run: npm run build
        env:
          VERCEL: "1"
          NODE_ENV: production

  e2e:
    name: Playwright End-to-End Browser Tests
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Sync Dataset Directories
        run: npm run data:sync

      - name: Build Production App for E2E
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright Test Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

